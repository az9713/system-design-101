<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Authentication and authorization flow</title>
  <desc id="desc">The client authenticates, receives tokens or a session, sends a request, and the server authorizes the requested action before returning data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315a7d"/>
    </marker>
    <style>
      .box{fill:#f7fafc;stroke:#315a7d;stroke-width:2}
      .accent{fill:#f7f1df;stroke:#d49b31;stroke-width:2}
      .secure{fill:#eff8f1;stroke:#3b7c4a;stroke-width:2}
      .text{font:16px Arial, sans-serif;fill:#1d2b36}
      .small{font:13px Arial, sans-serif;fill:#2f4050}
      .label{font:700 18px Arial, sans-serif;fill:#1d2b36}
      .arrow{stroke:#315a7d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="40" y="45" class="label">Auth bridge: identify first, then decide permission</text>
  <rect x="60" y="105" width="170" height="95" rx="8" class="box"/>
  <text x="145" y="143" text-anchor="middle" class="label">Client</text>
  <text x="145" y="168" text-anchor="middle" class="small">browser/mobile app</text>
  <rect x="325" y="90" width="190" height="125" rx="8" class="secure"/>
  <text x="420" y="130" text-anchor="middle" class="label">Auth Server</text>
  <text x="420" y="158" text-anchor="middle" class="small">checks identity</text>
  <text x="420" y="181" text-anchor="middle" class="small">issues session/JWT</text>
  <rect x="610" y="95" width="190" height="115" rx="8" class="box"/>
  <text x="705" y="134" text-anchor="middle" class="label">API Server</text>
  <text x="705" y="160" text-anchor="middle" class="small">verifies token</text>
  <text x="705" y="183" text-anchor="middle" class="small">runs route logic</text>
  <rect x="875" y="90" width="190" height="125" rx="8" class="accent"/>
  <text x="970" y="130" text-anchor="middle" class="label">Policy</text>
  <text x="970" y="158" text-anchor="middle" class="small">RBAC / ABAC / ACL</text>
  <text x="970" y="181" text-anchor="middle" class="small">what can user do?</text>
  <path d="M230 145 L325 145" class="arrow"/>
  <text x="247" y="127" class="small">credentials</text>
  <path d="M325 180 L230 180" class="arrow"/>
  <text x="238" y="210" class="small">session cookie or token</text>
  <path d="M230 255 C380 285 505 270 610 185" class="arrow"/>
  <text x="278" y="300" class="small">request with bearer token, API key, or cookie</text>
  <path d="M800 150 L875 150" class="arrow"/>
  <text x="815" y="132" class="small">authorize</text>
  <path d="M875 185 L800 185" class="arrow"/>
  <text x="814" y="210" class="small">allow/deny</text>
  <path d="M610 210 C450 365 275 360 170 205" class="arrow"/>
  <text x="288" y="390" class="small">data, 401 unauthenticated, or 403 forbidden</text>
  <rect x="80" y="435" width="420" height="78" rx="8" fill="#f7f1df" stroke="#d49b31"/>
  <text x="105" y="466" class="text">Authentication asks: who are you?</text>
  <text x="105" y="492" class="text">Authorization asks: what are you allowed to do?</text>
  <rect x="590" y="435" width="405" height="78" rx="8" fill="#eff8f1" stroke="#3b7c4a"/>
  <text x="615" y="466" class="text">JWT is a token format, not a magic auth system.</text>
  <text x="615" y="492" class="text">OAuth2 delegates access; OIDC adds identity.</text>
</svg>
